function form(inner,button='Save'){return '<form onsubmit="handleForm(event)">'+inner+'<button class="primary full" type="submit">'+button+'</button></form>'}
function dialog(){let content='';const a=db.assignments.find(a=>a.id===selected),s=db.submissions.find(s=>s.id===selected),m=db.modules.find(m=>m.id===selected),q=db.quizzes.find(q=>q.id===selected);
if(modal==='accounts')content='<p class="hint">Demo account switching is not secure login. Data persists only in this browser.</p>'+db.users.map(u=>'<button class="user-choice" onclick="switchAccount(\''+u.id+'\')"><b>'+esc(u.name)+'</b><small>'+u.role+'</small></button>').join('')+'<button class="secondary" onclick="resetDemo()">Reset sample data</button>';
if(modal==='courses')content=form(field('Course code','code')+field('Course title','title')+field('Section','section')+field('Description','body','textarea','','false')+'','Create course');
if(modal==='join')content=form(field('Join code','join'),'Join class');
if(modal==='modules')content=form(courseField()+field('Module title','title')+field('Learning content','body','textarea')+field('Learning URL (optional)','url','url','',false),'Publish module');
if(modal==='assignments')content=form(courseField()+field('Assignment title','title')+field('Instructions','body','textarea')+field('Deadline','due','date')+field('Points','points','number','100'),'Publish assignment');
if(modal==='announcements')content=form(courseField()+field('Announcement title','title')+field('Message','body','textarea'),'Post announcement');
if(modal==='module-view')content='<h3>'+esc(m.title)+'</h3><p style="white-space:pre-wrap;line-height:1.7">'+esc(m.body)+'</p>'+(m.url?'<a href="'+esc(m.url)+'" target="_blank" rel="noopener noreferrer">Open linked resource ↗</a>':'');
if(modal==='submit')content='<p class="hint">'+esc(a.title)+' · due '+fmt(a.due)+'</p>'+form(field('Your answer or shareable link','body','textarea',mySub(a.id)?.body||''),'Submit work');
if(modal==='submissions')content='<p class="hint">'+esc(a.title)+' · '+a.points+' points</p>'+db.submissions.filter(s=>s.assignment===a.id).map(s=>'<div class="feed"><strong>'+esc(usr(s.student)?.name)+' · '+(s.score===null?'Needs grading':s.score+'/'+a.points)+'</strong><p>'+esc(s.body)+'</p><p>'+fmt(s.date)+'</p><button class="secondary" onclick="openModal(\'grade\',\''+s.id+'\')">Grade work</button></div>').join('')||empty('No submissions yet');
if(modal==='grade')content=form(field('Score (max '+db.assignments.find(a=>a.id===s.assignment)?.points+')','score','number',s.score??'')+field('Feedback','feedback','textarea',s.feedback||'',false),'Save grade');
if(modal==='attendance'){const at=db.attendance.find(a=>a.id===selected);const c=course(at?.course||mine()[0]?.id);content=form('<label class="field"><span>Course</span><select name="course" onchange="attendanceCourse(this.value)">'+mine().map(x=>'<option '+(x.id===c?.id?'selected':'')+' value="'+x.id+'">'+esc(x.code)+'</option>').join('')+'</select></label>'+field('Date','date','date',at?.date||today())+'<div id="roster">'+roster(c,at)+'</div>','Save attendance')}
if(modal==='quizzes')content=form(courseField()+field('Quiz title','title')+field('Total points','points','number','20')+field('Question','question')+field('Option A (correct answer)','a')+field('Option B','b')+field('Option C','c','text','',false),'Publish quiz');
if(modal==='take-quiz')content='<form onsubmit="handleForm(event)"><p class="hint">'+esc(q.title)+' · '+q.points+' points · One attempt</p>'+q.questions.map((item,i)=>'<div class="feed"><strong>'+(i+1)+'. '+esc(item.text)+'</strong>'+item.options.map((o,j)=>'<label class="answer"><input type="radio" name="q'+i+'" value="'+j+'" required> '+esc(o)+'</label>').join('')+'</div>').join('')+'<button class="primary full">Submit quiz</button></form>';
return '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="dialog"><div class="dialog-head"><h2>'+({accounts:'Switch demo account',courses:'Create course',join:'Join class',modules:'Publish module',assignments:'New assignment',announcements:'New announcement','module-view':'Learning module',submit:'Submit assignment',submissions:'Student submissions',grade:'Grade submission',attendance:'Attendance register',quizzes:'Create quiz','take-quiz':'Take quiz'})[modal]+'</h2><button class="close" onclick="closeModal()">×</button></div>'+content+'</div></div>'}
function roster(c,at){return c?c.students.map(st=>'<label class="student-line"><b>'+esc(usr(st)?.name)+'</b><select name="student_'+st+'">'+['present','late','absent','excused'].map(v=>'<option '+(at?.records[st]===v?'selected':'')+' value="'+v+'">'+v+'</option>').join('')+'</select></label>').join(''):'<p>No students enrolled.</p>'}
function attendanceCourse(x){const at=db.attendance.find(a=>a.id===selected&&a.course===x);$('#roster').innerHTML=roster(course(x),at)}
function switchAccount(x){userId=x;localStorage.setItem('academe-user',x);modal='';changePage('dashboard')}function resetDemo(){if(confirm('Reset all demo records?')){db=structuredClone(seed);save();closeModal()}}
function remove(kind,x){if(!confirm('Delete this item?'))return;db[kind]=db[kind].filter(v=>v.id!==x);if(kind==='assignments')db.submissions=db.submissions.filter(s=>s.assignment!==x);save();notice('Item deleted')}
function handleForm(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const stamp={id:id(),date:today()};try{switch(modal){
case 'courses':db.courses.push({id:id(),code:f.code,name:f.title,section:f.section,description:f.body,teacher:userId,students:[],join:Math.random().toString(36).slice(2,8).toUpperCase(),color:'blue'});break;
case 'join':{const c=db.courses.find(c=>c.join.toUpperCase()===f.join.trim().toUpperCase());if(!c)throw Error('Invalid join code');if(!c.students.includes(userId))c.students.push(userId);break;}
case 'modules':db.modules.push({...stamp,course:f.course,title:f.title,body:f.body,url:f.url});break;
case 'assignments':db.assignments.push({...stamp,course:f.course,title:f.title,body:f.body,due:f.due,points:Math.max(1,Number(f.points))});break;
case 'announcements':db.announcements.push({...stamp,course:f.course,title:f.title,body:f.body});break;
case 'submit':{let old=mySub(selected);if(old){old.body=f.body;old.date=today();old.score=null;old.feedback=''}else db.submissions.push({...stamp,assignment:selected,student:userId,body:f.body,score:null,feedback:''});break;}
case 'grade':{const s=db.submissions.find(s=>s.id===selected);const max=db.assignments.find(a=>a.id===s.assignment).points;const score=Number(f.score);if(!Number.isFinite(score)||score<0||score>max)throw Error('Score must be between 0 and '+max);s.score=score;s.feedback=f.feedback;break;}
case 'attendance':{const records={};Object.keys(f).filter(k=>k.startsWith('student_')).forEach(k=>records[k.slice(8)]=f[k]);const old=db.attendance.find(a=>a.course===f.course&&a.date===f.date);if(old)old.records=records;else db.attendance.push({id:id(),course:f.course,date:f.date,records});break;}
case 'quizzes':db.quizzes.push({...stamp,course:f.course,title:f.title,points:Math.max(1,Number(f.points)),questions:[{text:f.question,options:[f.a,f.b,f.c].filter(Boolean),correct:0}]});break;
case 'take-quiz':{if(db.attempts.some(a=>a.quiz===selected&&a.student===userId))throw Error('You have already taken this quiz');const quiz=db.quizzes.find(x=>x.id===selected);const correct=quiz.questions.filter((q,i)=>Number(f['q'+i])===q.correct).length;db.attempts.push({...stamp,quiz:selected,student:userId,score:Math.round(correct/quiz.questions.length*quiz.points)});break;}
}modal='';selected=null;save();notice('Saved successfully')}catch(err){alert(err.message)}}
render();
</script></body></html>
