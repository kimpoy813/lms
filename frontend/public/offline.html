<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduSphere — offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f7fb; color: #171a29; }
      main { max-width: 26rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.35rem; margin: 1rem 0 .5rem; }
      p { color: #4d5470; line-height: 1.55; }
      a { display: inline-block; margin-top: 1rem; padding: .65rem 1.2rem; border-radius: .7rem; background: #4f46e5; color: #fff; text-decoration: none; font-weight: 600; }
      @media (prefers-color-scheme: dark) { body { background: #0d0f18; color: #eceef6; } p { color: #aab1c9; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" width="64" height="64" />
      <h1>You are offline</h1>
      <p>EduSphere needs an internet connection to load your classes, record attendance and save your work. Nothing you see while offline is submitted.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
