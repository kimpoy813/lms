name: Discenda browser E2E

on:
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-e2e:
    name: ${{ github.event_name == 'pull_request' && 'Critical browser journeys' || 'Full browser suite' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/discenda
      PRISMA_SCHEMA_ENGINE: js
      CHECKPOINT_DISABLE: '1'
      PASSWORD_HASH_COST: '12'
      APP_URL: http://localhost:5173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run critical browser journeys on pull requests
        if: github.event_name == 'pull_request'
        run: npm run test:e2e -- e2e/tests/auth.spec.js e2e/tests/quiz.spec.js

      - name: Run the full browser suite nightly or on demand
        if: github.event_name != 'pull_request'
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
